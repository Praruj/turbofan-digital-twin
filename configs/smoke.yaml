# Fast end-to-end run on a small simulated fleet (no download); used by CI.
seed: 0
n_boot: 200
output_dir: results/smoke
data:
  source: simulated
  n_train: 24
  n_test: 12
  seed: 0
twin:
  healthy_cycles: 30
  baseline_cycles: 20
  eol_cycles: 10
  n_grid: 11
  process_sd_grid: [3.0e-5, 1.0e-4]
  meas_extra_grid: [0.0]
models:
  rul_cap: 125
  window: 30
  n_folds: 3
  interval: 0.8
  conformal_bins: [40, 80]
  gbm: {max_iter: 50, learning_rate: 0.1, max_leaf_nodes: 15, min_samples_leaf: 20, l2_regularization: 1.0}
validate:
  n_sim: 50
  n_recovery: 12
scarcity:
  n_train: [6, 24]
  repeats: 1
stages: [validate, benchmark, scarcity, figures]
